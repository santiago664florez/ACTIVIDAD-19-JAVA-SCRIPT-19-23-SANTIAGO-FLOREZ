
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Raíz cuadrada</title>
</head>
<body>

    <h1>Calcular raíz cuadrada</h1>

    <script>
        let numero = parseFloat(prompt("Ingrese un número:"));

        let raiz = Math.sqrt(numero);

        document.write("El número ingresado es: " + numero + "<br>");
        document.write("La raíz cuadrada es: " + raiz);
    </script>

</body>
</html>
