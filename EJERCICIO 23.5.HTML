
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificar correo electrónico</title>
</head>
<body>

    <h1>Verificar dirección de email</h1>

    <script>
        function verificarEmail(email) {
            if (email.indexOf("@") != -1) {
                return true;
            } else {
                return false;
            }
        }

        let email = prompt("Ingrese su dirección de email:");

        if (verificarEmail(email)) {
            document.write("La dirección de email contiene el carácter @");
        } else {
            document.write("La dirección de email no contiene el carácter @");
        }
    </script>

</body>
</html>
