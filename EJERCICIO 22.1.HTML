
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Número elevado al cubo</title>
</head>
<body>

    <h1>Número elevado a la tercera potencia</h1>

    <script>
        let numero = parseFloat(prompt("Ingrese un número:"));

        let resultado = numero * numero * numero;

        document.write("El número ingresado es: " + numero + "<br>");
        document.write("El número elevado a la tercera potencia es: " + resultado);
    </script>

</body>
</html>
